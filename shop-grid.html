<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, minimum-scale=1.0">
  <link rel="stylesheet" href="css/vendor/font-awesome.min.css">
  <link rel="stylesheet" href="css/vendor/simple-line-icons.css">
  <link rel="stylesheet" href="css/vendor/magnific-popup.css">
  <link rel="stylesheet" href="css/style.min.css">
  <!-- INQUIRY POPUP STYLES -->
  <link rel="stylesheet" href="inquiry-popup.css">
  <link rel="icon" href="favicon.ico">
  <title>Dentessa | Shop</title>
</head>
<body>

  <div id="dynamic-header"></div>

  <div class="section-navigation-wrap">
    <div class="section-navigation">
      <p class="section-navigation-path">
        <span class="path">Home</span>
        <span class="path"><svg class="svg-arrow tiny"><use xlink:href="#svg-arrow"></use></svg></span>
        <span class="path">Products</span>
        <span class="path bold"><svg class="svg-arrow tiny"><use xlink:href="#svg-arrow"></use></svg></span>
        <span class="path current" id="category-breadcrumb">All Products</span>
      </p>
    </div>
  </div>

  <div class="section-wrap">
    <div class="section no-title">
      <h3 class="title large" id="page-title">All Products</h3>
      <p class="pretitle" id="page-subtitle">Explore Our Complete Dental Solutions Portfolio</p>
      <hr class="line-separator">
      
      <div class="filter-header">
        <h6 class="title" id="results-count">Showing results...</h6>
        <div class="filter-options">
          <div class="filter-option">
            <h6 class="title">Browse By</h6>
            <label for="category_filter" class="select-block">
              <select name="category_filter" id="category_filter">
                <option value="">All Categories</option>
                <option value="Endodontics">Endodontics</option>
                <option value="Restorative Dentistry">Restorative Dentistry</option>
                <option value="Diagnosis & Prophylaxis">Diagnosis & Prophylaxis</option>
                <option value="Surgery">Surgery</option>
              </select>
              <svg class="svg-arrow face-down"><use xlink:href="#svg-arrow"></use></svg>
            </label>
          </div>
          <div class="filter-option">
            <h6 class="title">Product Type:</h6>
            <label for="type_filter" class="select-block">
              <select name="type_filter" id="type_filter">
                <option value="">All Types</option>
              </select>
              <svg class="svg-arrow face-down"><use xlink:href="#svg-arrow"></use></svg>
            </label>
          </div>
        </div>
      </div>

      <div class="product-list column-4-wrap" id="dynamic-product-grid">
      </div>

      <div class="pager-wrap">
        <ul class="pager">
          <li class="pager-item"><a href="#"><svg class="svg-arrow medium inverted"><use xlink:href="#svg-arrow"></use></svg></a></li>
          <li class="pager-item selected"><a href="#">1</a></li>
          <li class="pager-item"><a href="#"><svg class="svg-arrow medium"><use xlink:href="#svg-arrow"></use></svg></a></li>
        </ul>
      </div>
    </div>
  </div>

  <div id="dynamic-footer"></div>

<script src="js/vendor/jquery-3.1.0.min.js"></script>
<script src="js/vendor/jquery.magnific-popup.min.js"></script>
<script src="js/vendor/imgLiquid-min.js"></script>
<script src="js/liquid.js"></script>
<script src="js/dropdowns.js"></script>
<script src="js/popups.js"></script>
<!-- INQUIRY POPUP SCRIPT -->
<script src="inquiry-popup.js"></script>

<script>
  /* ── INIT INQUIRY POPUP ─────────────────────── */
  DentessaInquiry.init({ email: 'info@dentessa.com' }); // ← CHANGE TO YOUR EMAIL

  /* ── GLOBAL STATE ───────────────────────────── */
  let allProducts = [];
  let filteredProducts = [];
  let currentCategory = '';
  let currentType = '';

  /* ── LOAD HEADER & FOOTER ───────────────────── */
  fetch('header.html')
    .then(r => r.text())
    .then(data => document.getElementById('dynamic-header').innerHTML = data);

  fetch('footer.html')
    .then(r => r.text())
    .then(data => document.getElementById('dynamic-footer').innerHTML = data);

  /* ── LOAD PRODUCTS ──────────────────────────── */
  fetch('data.json')
    .then(r => r.json())
    .then(data => {
      allProducts = data.products;

      initializeTypeFilter();

      // Read URL params
      const urlParams = new URLSearchParams(window.location.search);
      const initialCategory = urlParams.get('category');

      if (initialCategory) {
        document.getElementById('category_filter').value = initialCategory;
        currentCategory = initialCategory;
      }

      renderProducts();

      document.getElementById('category_filter').addEventListener('change', function () {
        currentCategory = this.value;
        currentType = '';
        document.getElementById('type_filter').value = '';
        updateTypeFilterOptions();
        renderProducts();
      });

      document.getElementById('type_filter').addEventListener('change', function () {
        currentType = this.value;
        renderProducts();
      });
    })
    .catch(error => console.error('Error loading products:', error));

  /* ── TYPE FILTER INIT ───────────────────────── */
  function initializeTypeFilter() {
    const typeSelect = document.getElementById('type_filter');
    const allTypes = new Set();
    allProducts.forEach(p => allTypes.add(p.type));

    Array.from(typeSelect.querySelectorAll('option')).forEach((o, i) => { if (i > 0) o.remove(); });

    Array.from(allTypes).sort().forEach(type => {
      const opt = document.createElement('option');
      opt.value = type;
      opt.textContent = type;
      typeSelect.appendChild(opt);
    });
  }

  function updateTypeFilterOptions() {
    const typeSelect = document.getElementById('type_filter');
    const available = new Set();

    allProducts.forEach(p => {
      if (!currentCategory || p.category === currentCategory) available.add(p.type);
    });

    Array.from(typeSelect.querySelectorAll('option')).forEach((o, i) => { if (i > 0) o.remove(); });

    Array.from(available).sort().forEach(type => {
      const opt = document.createElement('option');
      opt.value = type;
      opt.textContent = type;
      typeSelect.appendChild(opt);
    });
    typeSelect.value = '';
  }

  /* ── RENDER PRODUCTS ────────────────────────── */
  function renderProducts() {
    filteredProducts = allProducts.filter(p => {
      const catOk  = !currentCategory || p.category === currentCategory;
      const typeOk = !currentType     || p.type === currentType;
      return catOk && typeOk;
    });

    // Update breadcrumb / title / subtitle
    const breadcrumb  = document.getElementById('category-breadcrumb');
    const pageTitle   = document.getElementById('page-title');
    const pageSubtitle= document.getElementById('page-subtitle');

    if (currentCategory) {
      breadcrumb.textContent  = currentCategory;
      pageTitle.textContent   = currentCategory;
      pageSubtitle.textContent= currentType ? currentType : getCategorySubtitle(currentCategory);
    } else {
      breadcrumb.textContent  = 'All Products';
      pageTitle.textContent   = 'All Products';
      pageSubtitle.textContent= 'Explore Our Complete Dental Solutions Portfolio';
    }

    document.getElementById('results-count').innerText =
      `Showing ${filteredProducts.length} result${filteredProducts.length !== 1 ? 's' : ''}`;

    const gridContainer = document.getElementById('dynamic-product-grid');
    let htmlContent = '';

    filteredProducts.forEach(product => {
      // Safely escape product name for data attribute
      const safeName = product.name.replace(/"/g, '&quot;').replace(/'/g, '&#39;');

      htmlContent += `
        <div class="product-list-item column">

          <!-- PREVIEW / IMAGE -->
          <div class="product-list-item-preview">
            <figure class="product-img">
              <img src="${product.images.main}" alt="${product.name}" loading="lazy">
            </figure>
            <div class="product-list-item-actions">
              <div class="button-list wrap-4">
                <a href="product-page-v1.html?id=${product.id}" class="button square" title="View Product">
                  <svg class="svg-cart-small"><use xlink:href="#svg-cart-small"></use></svg>
                </a>
              </div>
            </div>
          </div>

          <!-- INFO -->
          <div class="product-list-item-info">
            <a href="product-page-v1.html?id=${product.id}">
              <h6 class="title">${product.name}</h6>
            </a>
            <p class="product-description">${product.short_descriptor}</p>

            <!-- PRICE — click triggers B2B inquiry popup -->
            <div class="product-list-item-price">
              <h6
                class="product-price small diq-trigger"
                data-product="${safeName}"
                title="Click to inquire about pricing"
                style="cursor:pointer; display:inline-flex; align-items:center; gap:8px;"
              >
                ${product.price}
                <span style="
                  font-size:10px;
                  font-weight:700;
                  letter-spacing:0.6px;
                  background:#E8600A;
                  color:#fff;
                  padding:3px 8px;
                  border-radius:3px;
                  text-transform:uppercase;
                  white-space:nowrap;
                ">Inquire</span>
              </h6>
            </div>
            <!-- /PRICE -->

          </div>
        </div>`;
    });

    if (!htmlContent) {
      htmlContent = `<p style="grid-column:1/-1;text-align:center;padding:40px;color:#888;">
        No products found matching the selected filters.
      </p>`;
    }

    gridContainer.innerHTML = htmlContent;

    // Bind inquiry popup to every price tag
    gridContainer.querySelectorAll('.diq-trigger').forEach(function (el) {
      el.addEventListener('click', function () {
        DentessaInquiry.open(this.dataset.product);
      });
    });

    // Re-init theme imgLiquid after HTML inject
    if (typeof jQuery !== 'undefined' && typeof imgLiquid !== 'undefined') {
      jQuery('.product-img').imgLiquid();
    }
  }

  /* ── CATEGORY SUBTITLES ─────────────────────── */
  function getCategorySubtitle(category) {
    const map = {
      'Endodontics':              'Healing Beyond the Surface — Perfect Seal · Efficient Canal Cleaning · Bioactive · Biocompatible',
      'Restorative Dentistry':    'Comprehensive Solutions for Aesthetic & Durable Restorations',
      'Diagnosis & Prophylaxis':  'Advanced Diagnostic Tools & Preventive Care Solutions',
      'Surgery':                  'Precision Instruments for Surgical Excellence'
    };
    return map[category] || 'Explore Our Dental Solutions';
  }
</script>
</body>
</html>
